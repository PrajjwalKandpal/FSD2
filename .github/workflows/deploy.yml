name: CD Pipeline - Experiment 20

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # JOB 1: Build Docker image and push to Docker Hub
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./Experiment20
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/experiment20:latest
            ${{ secrets.DOCKER_USERNAME }}/experiment20:${{ github.sha }}

      - name: Confirm push
        run: echo "Docker image pushed successfully!"

  # JOB 2: Pull image and run container (simulated deploy)
  deploy:
    name: Deploy Container
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Pull and run Docker container
        run: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/experiment20:latest
          docker run -d -p 3000:3000 \
            --name experiment20 \
            ${{ secrets.DOCKER_USERNAME }}/experiment20:latest

      - name: Wait for container to start
        run: |
          for i in {1..10}; do
            curl -sf http://localhost:3000/health && echo "Health check passed!" && exit 0
            echo "Attempt $i failed, retrying in 3s..."
            sleep 3
          done
          echo "Health check failed after all retries"
          exit 1

      - name: Show running containers
        run: docker ps
