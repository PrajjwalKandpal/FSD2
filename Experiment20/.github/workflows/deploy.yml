name: CD Pipeline - Experiment20

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/testing-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/testing-backend:${{ github.sha }}

      - name: Image digest
        run: echo "Image pushed successfully!"

  deploy:
    name: Deploy Container
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Pull and run Docker container
        run: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/testing-backend:latest
          docker run -d -p 3000:3000 \
            --name testing-backend \
            ${{ secrets.DOCKER_USERNAME }}/testing-backend:latest

      - name: Health check
        run: |
          sleep 5
          curl -f http://localhost:3000/health || exit 1
          echo "Health check passed!"

      - name: Show running containers
        run: docker ps